# Fly.io config for the AI Town Planner web app (see server/README.md).
app = "ai-town-planner"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  DIST_DIR = "/app/dist"
  PORT = "8080"

# Data pack (~2.4 GB unpacked) lives on the volume; downloaded on first start.
[mounts]
  source = "pack"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
