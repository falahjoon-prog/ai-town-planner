name: Build app

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "pipeline/**", ".github/workflows/datapack.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      # Trade AI sign-in (licensing/README.md): public project URL and anon key, written into the app at build time
      TRADEAI_SUPABASE_URL: ${{ vars.TRADEAI_SUPABASE_URL || 'https://iqtilarntgenosjrevoz.supabase.co' }}
      TRADEAI_SUPABASE_ANON_KEY: ${{ vars.TRADEAI_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxdGlsYXJudGdlbm9zanJldm96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3Nzg5MTIsImV4cCI6MjEwOTM1NDkxMn0.dGVLYsoCD0xXdpNEFLFJ70UO8kVE5xytOGxtcyRQlzM' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libclang-dev cmake
      - name: libclang (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> $GITHUB_ENV
      - run: npm install
      - name: Check map links
        if: runner.os == 'Linux'
        run: python3 .github/scripts/check_links.py
      - run: npx tauri icon app-icon.png
      - name: Compile check (reports errors as annotations)
        shell: bash
        run: |
          report() { { grep -B2 -A14 -E "^(error|.*error TS|CMake Error)" "$1" || tail -80 "$1"; } | head -160 | awk '{printf "%s%%0A", $0}' | sed "s/^/::error title=$2::/"; echo; exit 1; }
          npm run build > web.log 2>&1 || report web.log Frontend
          cd src-tauri && cargo build --release > ../rust.log 2>&1 || report ../rust.log Rust
      - name: Rust unit tests
        if: runner.os == 'Linux'
        run: cd src-tauri && cargo test --release --lib
      - name: Bundle installers
        shell: bash
        run: |
          npx tauri build > tauri.log 2>&1 || { tail -70 tauri.log | awk '{printf "%s%%0A", $0}' | sed 's/^/::error title=Bundle::/'; echo; exit 1; }
          tail -15 tauri.log
      - name: Publish to release
        if: github.ref == 'refs/heads/main' # test builds from other branches don't replace the release installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="app-v$V"
          gh release create "$TAG" --title "AI Town Planner v$V" --prerelease \
            --notes "Desktop installers. Windows: .msi or -setup.exe. Mac: .dmg. Linux: .AppImage or .deb. Then in Settings import the latest data pack and download an AI model." 2>/dev/null || true
          shopt -s nullglob
          B=src-tauri/target/release/bundle
          FILES=($B/msi/*.msi $B/nsis/*.exe $B/dmg/*.dmg $B/appimage/*.AppImage $B/deb/*.deb)
          printf '%s\n' "${FILES[@]}"
          gh release upload "$TAG" "${FILES[@]}" --clobber
