name: Build app

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "pipeline/**", ".github/workflows/datapack.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libclang-dev cmake
      - name: libclang (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> $GITHUB_ENV
      - run: npm install
      - run: npx tauri icon app-icon.png
      - name: Compile check (reports errors as annotations)
        shell: bash
        run: |
          report() { { grep -B2 -A14 -E "^(error|.*error TS|CMake Error)" "$1" || tail -80 "$1"; } | head -160 | awk '{printf "%s%%0A", $0}' | sed "s/^/::error title=$2::/"; echo; exit 1; }
          npm run build > web.log 2>&1 || report web.log Frontend
          cd src-tauri && cargo build --release > ../rust.log 2>&1 || report ../rust.log Rust
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "AI Town Planner v__VERSION__"
          releaseBody: "Desktop installers. Windows: .msi or -setup.exe. Mac: .dmg. Then import the latest data pack and download an AI model in Settings."
          releaseDraft: false
          prerelease: true
