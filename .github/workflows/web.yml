name: Web app

on:
  push:
    branches: [main, web-server]
    paths:
      - "server/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "src-tauri/src/**"
      - "src-tauri/knowledge/**"
      - "deploy/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Build and test server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build
        run: cd server && cargo build --release --locked
      - name: Test
        run: cd server && cargo test --release --locked

  bundle:
    name: Web app bundle (linux-amd64)
    if: github.ref == 'refs/heads/main'
    needs: server
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: npm ci --no-audit --no-fund
      - run: npx vite build
      - name: Build (Trade AI sign-in address and public anon key written in from the repository variables)
        env:
          TRADEAI_SUPABASE_URL: ${{ vars.TRADEAI_SUPABASE_URL || 'https://iqtilarntgenosjrevoz.supabase.co' }}
          TRADEAI_SUPABASE_ANON_KEY: ${{ vars.TRADEAI_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlxdGlsYXJudGdlbm9zanJldm96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM3Nzg5MTIsImV4cCI6MjEwOTM1NDkxMn0.dGVLYsoCD0xXdpNEFLFJ70UO8kVE5xytOGxtcyRQlzM' }}
        run: cd server && cargo build --release --locked
      - name: Publish the pre-built web app (the Oracle server downloads it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir pkg && cp server/target/release/atp-server pkg/ && cp -r dist pkg/dist
          tar -czf town-planner-web-linux-amd64.tar.gz -C pkg .
          gh release create web-latest --title "Web app (latest build)" --prerelease --latest=false \
            --notes "Pre-built phone web app for the Oracle server; replaced on every push to main." 2>/dev/null || true
          gh release upload web-latest town-planner-web-linux-amd64.tar.gz --clobber
