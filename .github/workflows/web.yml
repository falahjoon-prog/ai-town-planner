name: Web app

on:
  push:
    branches: [main, web-server]
    paths:
      - "server/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "src-tauri/src/**"
      - "src-tauri/knowledge/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/scripts/hf_deploy.py"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Build and test server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Build
        run: cd server && cargo build --release --locked
      - name: Test
        run: cd server && cargo test --release --locked

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hugging Face Spaces
    needs: [server, image]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: No Hugging Face token yet
        if: env.HF_TOKEN == ''
        run: echo "::notice title=Deploy skipped::Add the HF_TOKEN repository secret (see server/README.md), then re-run this workflow."
      - uses: actions/checkout@v4
        if: env.HF_TOKEN != ''
      - name: Push the app to the Space (Hugging Face builds the Docker image)
        if: env.HF_TOKEN != ''
        run: |
          pip install --quiet huggingface_hub
          python3 .github/scripts/hf_deploy.py
