#cloud-config
# AI Town Planner web app on an Oracle Cloud "Always Free" Ubuntu 24.04 VM (VM.Standard.E2.1.Micro or A1).
# Paste this whole file into: Create instance -> Advanced options -> Initialization script.
# The server downloads the pre-built app from GitHub, serves it over HTTPS (Caddy) and
# checks for a newer build every 15 minutes.
package_update: true
packages: [git, curl, ca-certificates, netfilter-persistent, iptables-persistent]
runcmd:
  - git clone --depth 1 https://github.com/falahjoon-prog/ai-town-planner /opt/atp
  - bash /opt/atp/deploy/oracle/setup.sh
